  <text class="key" x="78" y="1138">[۱]  Ballinari &amp; Maly (2025) — FX Sentiment Analysis with Large Language Models</text>
  <text class="key" x="78" y="1162">[۲]  Du و همکاران (2024) — Financial Sentiment Analysis: Techniques and Applications</text>
  <text class="key" x="78" y="1186">[۳]  Huang و همکاران (2023) — FinBERT</text>
  <text class="key" x="78" y="1210">[۴]  Gurgul و همکاران (2025) — Deep Learning and NLP in Cryptocurrency Forecasting</text>
  <text class="key" x="78" y="1234">[۵]  Pencheva (2025) — Profiling Noisy Social Media Data for Sentiment Applications</text>
  <text class="key" x="78" y="1258">[۶]  Farahani و همکاران (2021) — ParsBERT</text>
  <text class="key" x="78" y="1282">[۷]  Wu و همکاران (2023) — BloombergGPT</text>
  <text class="key" x="78" y="1306">[۸]  Sohangir و همکاران (2018) — Deep Learning for Financial Sentiment Analysis</text>
  <text class="key" x="78" y="1330">[۹]  Xing (2025) — Designing Heterogeneous LLM Agents for Financial Sentiment Analysis</text>
  <text class="key" x="78" y="1354">[۱۰] Seshakagari و همکاران (2025) — Dynamic Financial Sentiment Analysis &amp; Market Forecasting</text>
